name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (seeded integration test)
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/doctor_tracker_ci
      JWT_SECRET: ci-secret-not-used-in-any-real-env-0000000000
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: test
      PORT: 5000
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Seed uses dropDatabase first, so every CI run starts from the known dataset.
      - name: Seed the test database
        run: npm run seed

      - name: Boot API and smoke-test endpoints
        run: |
          npm start & sleep 8
          echo "--- health ---"
          curl -sf http://localhost:5000/api/health; echo
          echo "--- unauthenticated request rejected ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/doctors)
          echo "GET /api/doctors without token -> $code"
          [ "$code" = "401" ] || { echo "FAIL: expected 401"; exit 1; }
          echo "--- authenticated login + data ---"
          TOKEN=$(curl -sf -X POST http://localhost:5000/api/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"email":"admin@doctortracker.com","password":"Admin@123"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token'])")
          [ -n "$TOKEN" ] || { echo "FAIL: no token from login"; exit 1; }
          echo "login OK, token length: ${#TOKEN}"
          DOCTORS=$(curl -sf http://localhost:5000/api/doctors?limit=3 \
            -H "Authorization: Bearer $TOKEN" -H 'Origin: http://localhost:3000')
          echo "$DOCTORS" | python3 -c "
import json,sys
d = json.load(sys.stdin)
assert d['success'], 'not success'
n = d['data']['total']
print(f'doctors list OK: {n} doctors')
assert n >= 20, 'seeded doctor count too low'
"
          echo "ALL BACKEND CHECKS PASSED"

  frontend:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://doctor-tracker-api-gamma.vercel.app

      - name: Build output sanity check
        run: |
          test -f .next/BUILD_ID && echo "Next.js build output present"
